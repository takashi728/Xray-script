on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.*'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'Dockerfile.*'
  schedule:
    - cron: '0 6 * * 0'  # weekly rebuild

jobs:
  build-xray:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.xray
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/takashi728/xray-core:latest
            ghcr.io/takashi728/xray-core:${{ github.sha }}
  build-caddy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.caddy
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/takashi728/caddy-l4:latest
            ghcr.io/takashi728/caddy-l4:${{ github.sha }}
