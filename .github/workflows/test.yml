name: E2E - REALITY

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'Dockerfile.*'
      - '.github/scripts/gen-configs.py'
      - 'config/xray/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build xray-core Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.xray
          push: false
          load: true
          tags: xray-core:e2e

      - name: Generate REALITY keypair
        id: keys
        run: |
          KEYS="$(docker run --rm --entrypoint xray xray-core:e2e x25519)"
          echo "private=$(echo "$KEYS" | sed -n 's/.*Private key: //p' | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "public=$(echo "$KEYS"  | sed -n 's/.*Public key: //p' | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "uuid=$(cat /proc/sys/kernel/random/uuid)" >> "$GITHUB_OUTPUT"
          echo "short_id=$(openssl rand -hex 8)" >> "$GITHUB_OUTPUT"

      - name: Generate Xray configs (server + client)
        run: |
          export UUID="${{ steps.keys.outputs.uuid }}"
          export PRIVATE_KEY="${{ steps.keys.outputs.private }}"
          export PUBLIC_KEY="${{ steps.keys.outputs.public }}"
          export SHORT_ID="${{ steps.keys.outputs.short_id }}"
          python3 .github/scripts/gen-configs.py

      - name: Start server container (VPS)
        run: |
          docker network create xray-e2e
          docker run -d --name xray-server \
            --network xray-e2e \
            -v /tmp/xray-e2e/server:/usr/local/etc/xray \
            xray-core:e2e
          sleep 3
          docker logs xray-server

      - name: Start client container (Linux)
        run: |
          docker run -d --name xray-client \
            --network xray-e2e \
            -p 127.0.0.1:1080:1080 \
            -v /tmp/xray-e2e/client:/usr/local/etc/xray \
            xray-core:e2e
          sleep 3
          docker logs xray-client

      - name: Test HTTP(S) through REALITY tunnel
        run: |
          echo "=== Test 1: google.com ==="
          CODE="$(curl -sS --max-time 20 \
            --socks5-hostname 127.0.0.1:1080 \
            -o /dev/null -w '%{http_code}' \
            https://www.google.com)"
          echo "HTTP $CODE"
          [[ "$CODE" == "200" ]] || { echo "FAIL (got $CODE)"; exit 1; }
          echo "PASS"

          echo "=== Test 2: 1.1.1.1 ==="
          CODE="$(curl -sS --max-time 20 \
            --socks5-hostname 127.0.0.1:1080 \
            -o /dev/null -w '%{http_code}' \
            https://1.1.1.1)"
          echo "HTTP $CODE"
          [[ "$CODE" == "200" ]] || { echo "FAIL (got $CODE)"; exit 1; }
          echo "PASS"

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Server logs ==="
          docker logs xray-server 2>&1 | tail -50 || true
          echo "=== Client logs ==="
          docker logs xray-client 2>&1 | tail -50 || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f xray-server xray-client 2>/dev/null || true
          docker network rm xray-e2e 2>/dev/null || true
